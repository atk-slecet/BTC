 POLITICS_OLOF_PALME_NOTUSED_DESC:0 "奥洛夫·帕尔梅在成年后成为了瑞典工人阶级的卫士，但他并没有一个能引以为豪的卑微出身，相反，他出生于斯德哥尔摩一户富裕而又保守的路德宗家庭。帕尔梅自幼体弱多病，将大把的时间都投入到了读书之中，年纪轻轻便掌握了英、法、德三国语言，这对他今后的生活大有裨益。第二次世界大战期间，帕尔梅曾短暂服役于瑞典军队，亲身经历了全国上下对德军入侵的惶悚不安。后来，帕尔梅前往美国深造，也正是在此期间，他的政治思想逐渐成型。与国家进步公约的接触让帕尔梅意识到了种族主义与阶级斗争的问题，短暂的亚洲之行更是让他亲眼目睹了日本帝国主义的可怖面目。五十年代末回国后，帕尔梅决心投身瑞典政坛。在1958年选举中，他成功跻身下议院，在政府各部门的出色表现令这位半激进进步人士备受瞩目。两年后，帕尔梅被任命为副首相，并在1961年底作为塔格·埃兰德的门生接替其成为瑞典首相。\n\n尽管担任首相的时间并不算长，奥洛夫·帕尔梅——这位风华正茂的新任政府首脑，还是凭借着他那口若悬河、声情并茂的演讲口才迅速在公众心中留下了深刻印象。只不过，首相对某些奉行外交孤立国家的访问引发了瑞典民众与国际社会的广泛争议，尤其是造访共产主义古巴一行。帕尔梅毫不讳言他对主宰欧陆独裁政权的鄙夷，在予以微妙的辛辣讽刺同时保持谨慎的绥靖政策。1962年伊始，奥洛夫·帕尔梅正式开启了他的首相任期。虽然政策方针饱受批评、时遭诟病，但他对这份新工作尽职尽责的态度无可挑剔。"
 
