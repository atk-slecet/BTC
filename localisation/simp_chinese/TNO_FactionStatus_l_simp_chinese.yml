 ITA_Rome_Pact_Member: "罗马条约成员国"
 ITA_Rome_Pact_Member_desc: ""
 ITW_temp_faction_member: "黎凡特防卫协定成员国"
 ITW_temp_faction_member_desc: "[This.GetNameDefCap]是[This.GetFactionName]的成员国。他们在一个阵营中，因此阵营内若有成员遭到进攻或是进入战争状态，此阵营中的其他成员也将加入这场战争支援盟国。于此大千世界，阵营成员将互帮互助，以集体之意志向其他国家施加影响。阵营也不仅限于军事方面，其可以延伸到各个领域，如经济合作和其他形式的互惠合作。"
 OFN_Suspended_Member: "自由国家组织成员资格中止"
 OFN_Suspended_Member_effect: "[!OFN_Suspended_Member]"
 OFN_Suspended_Member_desc: "加入OFN后被中止成员资格的情况非常罕见，这样的违规国家通常会面临制裁等处罚措施，资格被中止的原因通常是践踏人权、颠覆民主或其他违背OFN核心价值观的诸种行为。对被中止资格的国家而言，这是一场外交灾难，德国、日本、乃至美国都不希望与之合作。重新加入OFN的道路漫长而艰难，但并非完全不可能。"
 BRA_Hegemon_of_South_America: "南美霸主"
 BRA_Hegemon_of_South_America_effect: "[!BRA_Hegemon_of_South_America]"
 BRA_Hegemon_of_South_America_desc: "战争的丧钟已然敲响，数百万巴西人整装进发，为捍卫本国南美洲霸主的地位而战。一众国家或被游说、或遭胁迫，被巴西外交部拉入阵营，与巴西携手并肩。这些国家大肆渲染说辞，声称一旦阿根廷无人制衡、没有力量监管约束其恶行，任由其肆意扩张，将会给整个南美大陆带来深重灾难。\n\n这场战事本无需付诸兵刃；上帝站在他们这边，站在终将坐拥南美大陆的正义之士一方。"
 ARG_Hegemon_of_South_America: "南美霸主"
 ARG_Hegemon_of_South_America_effect: "[!ARG_Hegemon_of_South_America]"
 ARG_Hegemon_of_South_America_desc: "布宜诺斯艾利斯的大街上，爱国的男女老少排成长队，保卫自己的家园，阻挡北方蛮族的铁蹄，摆脱巴西帝国主义的压迫。在拉普拉塔河对岸，他们的盟友也纷纷出现，誓要彻底粉碎他们的威胁，让这片大陆彻底摒弃南美洲存在多个真正霸主的观念。\n\n这场战事本无需付诸兵刃；上帝站在他们这边，站在终将坐拥南美大陆的正义之士一方。"
 BRA_aligned_state: "南美防务联盟成员国"
 ARG_aligned_state: "普拉塔联盟成员国"